<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вибач 🥺</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8eef7;--card:#fff;--ink:#1d2740;--mute:#5d6b85;--acc:#c2457a;--acc-ink:#fff;--line:#cfd9ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b2b;--card:#1f2940;--ink:#eef2fb;--mute:#9aa8c4;--acc:#e0699b;--acc-ink:#1a1020;--line:#33415f}}
:root[data-theme="dark"]{--bg:#141b2b;--card:#1f2940;--ink:#eef2fb;--mute:#9aa8c4;--acc:#e0699b;--acc-ink:#1a1020;--line:#33415f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:440px;margin:0 auto;padding:20px 18px 32px}
.screen{display:none;text-align:center}.screen.on{display:block}
img.hero{width:100%;max-height:52vh;object-fit:cover;border-radius:28px;display:block;margin:0 auto 18px}
h1{font-size:28px;line-height:1.2;margin:0 0 8px;font-weight:600}
p{color:var(--mute);margin:0 0 18px;font-size:17px}
.btns{display:flex;flex-direction:column;gap:12px;align-items:center;min-height:130px}
button{font:inherit;font-size:18px;border:0;border-radius:18px;padding:15px 22px;cursor:pointer;width:100%;transition:transform .15s}
button:active{transform:scale(.97)}button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.yes{background:var(--acc);color:var(--acc-ink);font-weight:600}
.no{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.opt{background:var(--card);color:var(--ink);border:3px solid transparent;padding:16px 8px;font-size:16px}
.opt b{display:block;font-size:44px;font-weight:400;margin-bottom:4px}
.opt.sel{border-color:var(--acc)}
.row{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.row .opt{padding:14px;font-size:17px}
.sum{background:var(--card);border-radius:20px;padding:16px;margin-bottom:18px;font-size:19px;color:var(--ink)}
.big{font-size:80px;margin:20px 0 8px}
</style></head><body><main>

 <h1>Я накосячив, але я виправлюсь 🥺</h1>
 <p>Дай мені один шанс, будь ласка</p>
 <div class="btns" id="b1">
  <button class="yes" id="listen">Слухаю тебе</button>
  <button class="no" id="nope">Не хочу з тобою говорити</button>
 </div>
</section>

<section class="screen" id="s2">
 <div class="big">🎟️</div>
 <h1 style="font-size:24px">Ну кароче тіпа лібо ідеш сюда, лібо тобі ну тіпа ти умрьош і тд.</h1>
 <p></p>
 <div class="grid" id="places"></div>
 <button class="yes" id="to3" disabled style="opacity:.4">Далі</button>
</section>

<section class="screen" id="s2b">
 <div class="big" id="subEmoji">🎬</div>
 <h1 id="subTitle"></h1>
 <p>Обирай уважно</p>
 <div class="row" id="subOpts"></div>
</section>

<section class="screen" id="s3">
 <div class="big">⏰</div>
 <h1>А коли?</h1>
 <p>Я підлаштуюсь під тебе</p>
 <div class="row" id="times"></div>
 <button class="yes" id="to4" disabled style="opacity:.4">Далі</button>
</section>

<section class="screen" id="s4">
 <div class="big">🥹</div>
 <h1>Остаточна відповідь?</h1>
 <div class="sum" id="sum"></div>
 <button class="yes" id="send">Підтвердити</button>
 <p style="margin-top:14px;font-size:15px">Назад дороги немає 😈</p>
</section>

<section class="screen" id="s5">
 <div class="big">🎉</div>
 <h1>Домовились!</h1>
 <p>Я вже біжу готуватись. Дякую, що дала шанс 💛</p>
</section>

</main>
<script>
var tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();}
var PLACES=[["🎬","Кіно"],["☕","Кава"],["🚗","Поїхати кудась в єбєня (Камянець або Меджибіж)",1],["🍻","Піти жоска бухать на Медвежку",1]];
var TIMES=["Сьогодні","Завтра","На вихідних","Коли тобі зручно"];
var NO=["Точно?","Ну будь ласка 🥺","Я куплю щось смачне","Остання спроба…","Окей, слухаю 😅"];
var pick={place:null,time:null},n=0;
function $(i){return document.getElementById(i)}
function show(i){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on')});$(i).classList.add('on');window.scrollTo(0,0)}
$('listen').onclick=function(){show('s2')};
$('nope').onclick=function(){
  var b=$('nope');
  if(n>=NO.length-1){show('s2');return}
  b.textContent=NO[n];n++;
  var l=$('listen');l.style.transform='scale('+(1+n*0.06)+')';l.style.margin=(n*3)+'px 0';
  b.style.transform='scale('+Math.max(.6,1-n*.08)+')';
  if(n%2===0){b.parentNode.insertBefore(b,l)}else{b.parentNode.appendChild(b)}
};
function choose(box,btn,key,val,next){
  box.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel')});
  btn.classList.add('sel');pick[key]=val;next.disabled=false;next.style.opacity=1;
}
PLACES.forEach(function(p){var b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+p[0]+'</b>'+p[1];if(p[2])b.style.gridColumn='1 / -1';
  b.onclick=function(){choose($('places'),b,'place',p[0]+' '+p[1],$('to3'))};$('places').appendChild(b)});
TIMES.forEach(function(t){var b=document.createElement('button');b.className='opt';b.textContent=t;
  b.onclick=function(){choose($('times'),b,'time',t,$('to4'))};$('times').appendChild(b)});
var SUB={'Кіно':['🎬','Який фільм?',['Якусь рандомну шляпу','Стра...шии...лкууу..']],'Медвежку':['🍻','Як будемо бухати?',['Бухать жоска','Чуть культурнінька віпіт']]};
$('to3').onclick=function(){pick.sub=null;var k=Object.keys(SUB).filter(function(x){return pick.place.indexOf(x)>-1})[0];if(!k){show('s3');return}var d=SUB[k];$('subEmoji').textContent=d[0];$('subTitle').textContent=d[1];var box=$('subOpts');box.innerHTML='';d[2].forEach(function(t){var b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=function(){pick.sub=t;show('s3')};box.appendChild(b)});show('s2b')};
$('to4').onclick=function(){$('sum').innerHTML=pick.place+(pick.sub?'<br>'+pick.sub:'')+'<br>'+pick.time;show('s4')};
$('send').onclick=function(){
  var data=JSON.stringify(pick);
  show('s5');
  if(tg){setTimeout(function(){tg.sendData(data)},1200)}
};
</script></body></html>
